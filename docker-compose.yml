services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: lifegrid, POSTGRES_USER: lifegrid, POSTGRES_PASSWORD: lifegrid}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U lifegrid"], interval: 5s, timeout: 3s, retries: 10}
  api:
    build: .
    environment: {DATABASE_URL: "postgresql+psycopg://lifegrid:lifegrid@db:5432/lifegrid", JWT_SECRET: "replace-this-local-secret"}
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
  web:
    image: node:22-alpine
    working_dir: /web
    volumes: ["./frontend:/web"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment: {VITE_API_URL: "http://localhost:8000"}
    depends_on: [api]
volumes: {pgdata: {}}
